<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Hub Ultra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
</head>
<body>
    <div id="login-screen" class="overlay">
        <div class="login-card glass">
            <h1>Cinema Hub 🍿</h1>
            <div class="profile-section">
                <img id="preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky">
                <div id="avatar-presets" class="presets"></div>
            </div>
            <input type="text" id="username" placeholder="اسمك">
            <input type="text" id="room-id" placeholder="رقم الغرفة">
            <input type="password" id="room-pass" placeholder="كلمة المرور">
            <button onclick="join()" class="btn-primary">دخول</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <header class="glass">
            <div class="search-section" id="admin-controls" style="display:none;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="showTab('tmdb')">بحث ذكي</button>
                    <button class="tab-btn" onclick="showTab('direct')">رابط مباشر</button>
                </div>
                <div id="tmdb-panel">
                    <input type="text" id="movieSearch" placeholder="ابحث عن فيلم...">
                    <div id="searchResults" class="dropdown glass"></div>
                </div>
                <div id="direct-panel" style="display:none;">
                    <input type="text" id="directLinkInput" placeholder="رابط mp4 أو m3u8...">
                    <button onclick="playDirectUrl()">تشغيل</button>
                </div>
            </div>
            <div id="user-list"></div>
        </header>

        <main>
            <div class="video-section">
                <div id="video-wrapper">
                    <video id="video" style="display:none;" controls></video>
                    <div id="youtube-player" style="display:none;"></div>
                    <div id="iframe-slot"></div>
                </div>
                <div class="controls-footer glass">
                    <button onclick="sendEmoji('❤️')">❤️</button>
                    <button onclick="sendEmoji('🔥')">🔥</button>
                    <button onclick="sendEmoji('🍿')">🍿</button>
                    <button id="mic-btn" onclick="toggleMic()">🔇</button>
                </div>
            </div>
            <aside class="glass">
                <div id="messages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب هنا...">
                </div>
            </aside>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
