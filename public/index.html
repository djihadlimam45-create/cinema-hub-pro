<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Hub Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="ambilight"></div>

    <div id="login-screen" class="overlay">
        <div class="login-card glass">
            <h1>Cinema Hub 🍿</h1>
            <div class="profile-section">
                <div class="profile-main">
                    <img id="preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky">
                    <input type="file" id="avatarInput" hidden accept="image/*">
                    <label for="avatarInput" class="upload-btn">📸</label>
                </div>
                <div id="avatar-presets" class="presets"></div>
            </div>
            <input type="text" id="username" placeholder="اسمك المستعار">
            <input type="text" id="room-id" placeholder="رقم الغرفة">
            <input type="password" id="room-pass" placeholder="كلمة المرور">
            <button onclick="join()" class="btn-primary">دخول السينما</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <header class="glass">
    <div class="search-box">
        <input type="text" id="movieSearch" placeholder="ابحث عن فيلم... 🔍">
        <div id="searchResults" class="dropdown glass"></div>
        
        <div class="direct-url-box" style="margin-top: 10px; display: flex; gap: 5px;">
            <input type="text" id="directLinkInput" placeholder="ضع رابط m3u8 أو mp4 هنا..." style="margin-bottom: 0; font-size: 12px;">
            <button onclick="playDirectUrl()" style="width: 80px; background: var(--primary); border: none; border-radius: 8px; color: white; cursor: pointer;">تشغيل</button>
        </div>
    </div>
    <div id="usersList" class="users-nav"></div>
</header>

        <main>
            <div class="video-section">
                <div id="video-wrapper">
                    <div id="video-touch-layer" onclick="handleLayerClick()"></div>
                    
                    <video id="video" style="display:none;" controls></video>
                    
                    <div id="youtube-player" style="display:none;"></div>
                    <div id="iframe-slot"></div> <div id="emoji-display"></div>
                </div>
                <div class="cinema-footer glass">
    <div class="reactions-bar">
        <button onclick="sendEmoji('🔥')" title="حماس!">🔥</button>
        <button onclick="sendEmoji('😂')" title="ضحك">😂</button>
        <button onclick="sendEmoji('😱')" title="رعب">😱</button>
        <button onclick="sendEmoji('❤️')" title="حب">❤️</button>
        <button onclick="sendEmoji('🍿')" title="فشار">🍿</button>
    </div>
</div>
            </div>
            <aside class="glass">
                <div class="chat-header">دردشة الغرفة</div>
                <div id="messages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                </div>
            </aside>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
