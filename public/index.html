<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Hub Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
</head>
<body>
    <div id="login-screen" class="overlay">
        <div class="login-card">
            <h1>Cinema Hub 🍿</h1>
            <div class="avatar-picker">
                <img id="preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=1">
                <div id="avatar-presets"></div>
            </div>
            <input type="text" id="username" placeholder="اسمك المستعار">
            <input type="text" id="room-id" placeholder="رقم الغرفة">
            <input type="password" id="room-pass" placeholder="كلمة المرور">
            <button onclick="join()" class="btn-primary">دخول الغرفة</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <header>
            <div class="search-area">
                <input type="text" id="movieSearch" placeholder="ابحث عن فيلم أو ضع رابط مباشر...">
                <div id="searchResults" class="dropdown"></div>
            </div>
            <div id="user-list"></div>
        </header>

        <main>
            <div class="video-container">
                <div id="video-wrapper">
                    <video id="video" style="display:none;" controls></video>
                    <div id="youtube-player"></div>
                    <div id="iframe-slot"></div>
                </div>
                <div class="controls-bar">
                    <div class="reactions">
                        <button onclick="sendEmoji('🔥')">🔥</button>
                        <button onclick="sendEmoji('😂')">😂</button>
                        <button onclick="sendEmoji('🍿')">🍿</button>
                    </div>
                    <button id="mic-btn" onclick="toggleMic()">🔇</button>
                </div>
            </div>

            <aside class="chat-section">
                <div id="messages"></div>
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="اكتب شيئاً...">
                </div>
            </aside>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
